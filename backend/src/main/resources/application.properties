spring.application.name=backend

# DATABASE
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/moviedb}
spring.datasource.username=${DB_USERNAME:movieuser}
spring.datasource.password=${DB_PASSWORD:moviepass}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# OMDB
omdb.api.url=https://www.omdbapi.com/
omdb.api.key=${OMDB_API_KEY}

# SERVER
server.port=${PORT:8080}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OMDB TIMEOUT
omdb.connect-timeout-ms=3000
omdb.read-timeout-ms=5000

# CACHE
spring.cache.type=caffeine
spring.cache.cache-names=omdbMovies
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=30m

# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0