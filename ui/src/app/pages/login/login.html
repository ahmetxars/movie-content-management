<div class="login-page">

  <div class="login-card">

    <h1>
      Sign In
    </h1>

    <p class="subtitle">
      Sign in to manage movie content.
    </p>


    <div class="form-field">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        [(ngModel)]="email"
        autocomplete="email"
        placeholder="admin@test.com"
      />

    </div>


    <div class="form-field">

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        (keyup.enter)="login()"
      />

    </div>


    <div
      *ngIf="errorMessage"
      class="error-message"
      role="alert"
      aria-live="assertive"
    >
      {{ errorMessage }}
    </div>


    <button
      type="button"
      class="sign-in-button"
      (click)="login()"
      [disabled]="loading"
    >
      {{
        loading
          ? 'Signing in...'
          : 'Sign In'
      }}
    </button>

    <div class="register-link">

  <span>
    Don't have an account?
  </span>

      <button
        type="button"
        class="register-link-button"
        (click)="goToRegister()"
      >
        Create Account
      </button>

    </div>

  </div>

</div>
