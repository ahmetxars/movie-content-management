<div class="login-page">

  <div class="login-card">

    <h1>
      Sign In
    </h1>

    <p class="subtitle">
      Sign in to manage movie content.
    </p>


    <div
      *ngIf="errorMessage"
      class="error-message"
      role="alert"
      aria-live="assertive"
    >
      {{ errorMessage }}
    </div>


    <form
      (ngSubmit)="login()"
    >

      <label for="email">
        Email
      </label>

      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        autocomplete="email"
        required
      />


      <label for="password">
        Password
      </label>

      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        required
      />


      <button
        type="submit"
        [disabled]="loading"
      >

        {{
          loading
            ? 'Signing in...'
            : 'Sign In'
        }}

      </button>

    </form>

  </div>

</div>
